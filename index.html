<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Banda FJU PA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --accent: #E8650A;
      --accent-dim: rgba(232,101,10,0.13);
      --accent-dim2: rgba(232,101,10,0.24);
      --bg: #0e0e10;
      --surface: #1a1a1e;
      --surface2: #242428;
      --text: #f0eee8;
      --muted: #8a8880;
      --border: rgba(255,255,255,0.08);
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'DM Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --theme-transition: background 0.25s, color 0.25s, border-color 0.25s;
    }

    body.light {
      --bg: #f7f4ef;
      --surface: #ede9e2;
      --surface2: #e2ddd5;
      --text: #1c1a17;
      --muted: #7a776f;
      --border: rgba(0,0,0,0.10);
    }

    html, body, #app, .header, .bottom-bar, .song-view, .drawer,
    .playlist-toggle, .ctrl-btn, .mode-btn, .song-item, .drawer-header {
      transition: var(--theme-transition);
    }

    html, body {
      height: 100%; height: 100dvh;
      background: var(--bg); color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden; touch-action: none;
    }

    #app {
      display: flex; flex-direction: column;
      height: 100dvh;
      max-width: 480px; margin: 0 auto; width: 100%;
      position: relative;
    }

    /* HEADER */
    .header {
      padding: 14px 16px 12px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 0.5px solid var(--border); flex-shrink: 0;
    }
    .header-title { font-family: var(--font-serif); font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    .header-title span { color: var(--accent); font-style: italic; }
    .playlist-toggle {
      background: var(--surface2); border: 0.5px solid var(--border);
      color: var(--text); padding: 8px 14px; border-radius: 20px;
      font-family: var(--font-sans); font-size: 13px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 6px; min-height: 40px;
    }
    .playlist-toggle svg { width: 14px; height: 14px; }

    /* SONG VIEW */
    .song-view {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 20px 16px 8px;
      scrollbar-width: thin; scrollbar-color: var(--surface2) transparent;
      touch-action: pan-y;
    }
    #zoomInner { transform-origin: top left; will-change: transform; }

    .song-meta { margin-bottom: 18px; }
    .song-title-display { font-family: var(--font-serif); font-size: 24px; font-weight: 600; line-height: 1.2; margin-bottom: 4px; }
    .song-artist-display { font-size: 13px; color: var(--muted); }
    .divider { width: 32px; height: 1.5px; background: var(--accent); border-radius: 2px; margin: 14px 0; }

    /* ── SEÇÃO ── */
    .cifra-section { margin-bottom: 24px; }

    .section-label {
      font-size: 10px; font-weight: 500; color: var(--accent);
      letter-spacing: 1.4px; text-transform: uppercase;
      margin-bottom: 10px; opacity: 0.8;
      display: block;
    }

    /* ── MODO AMBOS: par acorde+letra ── */
    .pair-block { margin-bottom: 2px; }
    .spacer-block { height: 10px; }

    .chord-row {
      display: block;
      font-family: var(--font-mono); font-size: 13px; font-weight: 500;
      color: var(--accent); white-space: pre; line-height: 1.35;
      max-height: 3em; overflow: hidden;
      transition: max-height 0.18s, opacity 0.18s;
    }
    .lyric-row {
      display: block;
      font-family: var(--font-sans); font-weight: 400;
      color: var(--text); white-space: pre-wrap; line-height: 1.65;
      max-height: 6em; overflow: hidden;
      transition: max-height 0.18s, opacity 0.18s, font-size 0.18s;
    }

    /* ── MODO CIFRA: grade de acordes ── */
    /*
      No modo cifra, cada seção exibe seus acordes como uma grade de células:
        C#m  |  F#m7  |  F  |  etc
      Os acordes são extraídos de todas as chord-rows da seção e exibidos
      em sequência com separador "|".
    */
    .chord-grid {
      display: none; /* oculto por padrão, ativado no modo cifra */
      flex-wrap: wrap;
      align-items: center;
      gap: 0;
      font-family: var(--font-mono); font-size: 14px; font-weight: 500;
      color: var(--accent);
      line-height: 2;
    }
    .chord-cell {
      display: flex; align-items: center; gap: 0;
      white-space: nowrap;
    }
    .chord-cell-name { padding: 0 6px 0 0; }
    .chord-sep { color: var(--muted); padding: 0 6px 0 0; opacity: 0.5; }

    /* ── MODOS ── */

    /* MODO LETRA: oculta acordes e grade, mantém letra + labels */
    body.mode-letra .chord-row   { max-height: 0 !important; opacity: 0; }
    body.mode-letra .pair-block  { margin-bottom: 0; }
    /* intro e ponte somem no modo letra */
    body.mode-letra .sec-intro,
    body.mode-letra .sec-ponte   { display: none; }

    /* MODO CIFRA: oculta letra e pares, mostra grade */
    body.mode-cifra .pair-block  { display: none; }
    body.mode-cifra .spacer-block { display: none; }
    body.mode-cifra .chord-grid  { display: flex; }

    /* EMPTY STATE */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 60vh; color: var(--muted); gap: 10px;
    }
    .empty-icon { font-size: 36px; opacity: 0.3; }
    .empty-text { font-size: 14px; }

    /* SWIPE HINT */
    .swipe-hint {
      position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: var(--muted);
      font-size: 11px; padding: 5px 14px; border-radius: 20px;
      pointer-events: none; opacity: 0; transition: opacity 0.35s;
      white-space: nowrap; z-index: 20;
    }
    .swipe-hint.show { opacity: 1; }

    /* BOTTOM BAR */
    .bottom-bar {
      flex-shrink: 0;
      padding: 6px 10px env(safe-area-inset-bottom, 8px);
      border-top: 0.5px solid var(--border); background: var(--bg);
      display: flex; align-items: center; gap: 6px;
    }
    .now-playing { flex: 1; min-width: 0; padding: 0 2px; }
    .np-title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-artist { font-size: 10px; color: var(--muted); }

    .sep { width: 0.5px; height: 30px; background: var(--border); flex-shrink: 0; }

    .ctrl-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
    .ctrl-label { font-size: 9px; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; line-height: 1; }
    .ctrl-row { display: flex; align-items: center; gap: 3px; }

    .ctrl-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--surface2); border: 0.5px solid var(--border);
      color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 400; font-family: var(--font-sans); line-height: 1;
      user-select: none;
    }
    .ctrl-btn:active { background: var(--surface); transform: scale(0.88); }
    .ctrl-btn.accent { background: var(--accent-dim); border-color: rgba(232,101,10,0.3); color: var(--accent); }
    .ctrl-btn.accent:active { background: var(--accent-dim2); }

    .mode-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--surface2); border: 0.5px solid var(--border);
      color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 500; font-family: var(--font-mono);
      user-select: none; flex-shrink: 0;
    }
    .mode-btn:active { transform: scale(0.88); }
    .mode-btn.on { background: var(--accent-dim); border-color: rgba(232,101,10,0.3); color: var(--accent); }

    .ctrl-display { font-size: 11px; font-weight: 500; min-width: 22px; text-align: center; color: var(--muted); }
    .tone-display  { font-size: 12px; font-weight: 500; min-width: 28px; text-align: center; color: var(--accent); font-family: var(--font-mono); }

    /* DRAWER */
    .drawer {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg); z-index: 10;
      transform: translateX(-100%);
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
      display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      padding: 14px 20px 12px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 0.5px solid var(--border); flex-shrink: 0;
    }
    .drawer-title { font-family: var(--font-serif); font-size: 18px; font-weight: 600; }
    .close-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 8px; display: flex; align-items: center; }

    .playlist-list { flex: 1; overflow-y: auto; padding: 8px 0; touch-action: pan-y; }
    .playlist-group { margin-bottom: 4px; }
    .playlist-group-name { font-size: 10px; font-weight: 500; color: var(--accent); letter-spacing: 1.2px; text-transform: uppercase; padding: 12px 20px 6px; }
    .song-item {
      display: flex; align-items: center; padding: 13px 20px;
      cursor: pointer; gap: 14px; min-height: 52px; transition: background 0.12s;
    }
    .song-item:active { background: var(--surface2); }
    .song-item.active { background: var(--accent-dim); }
    .song-item.active .song-number,
    .song-item.active .song-name { color: var(--accent); }
    .song-number { font-size: 11px; color: var(--muted); font-weight: 500; min-width: 20px; text-align: right; }
    .song-info { flex: 1; min-width: 0; }
    .song-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist-item { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .song-key-badge { font-size: 11px; color: var(--muted); font-family: var(--font-mono); background: var(--surface2); padding: 2px 7px; border-radius: 4px; flex-shrink: 0; }
    .active-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-title">Banda <span>FJU</span> Pará</div>
    <button class="playlist-toggle" onclick="openDrawer()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <line x1="2" y1="4" x2="14" y2="4"/>
        <line x1="2" y1="8" x2="14" y2="8"/>
        <line x1="2" y1="12" x2="10" y2="12"/>
      </svg>
      Playlist
    </button>
  </div>

  <div class="song-view" id="songView">
    <div id="zoomInner">
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">♩</div>
        <div class="empty-text">Selecione uma música na playlist</div>
      </div>
      <div id="cifraContent" style="display:none">
        <div class="song-meta">
          <div class="song-title-display" id="displayTitle"></div>
          <div class="song-artist-display" id="displayArtist"></div>
          <div class="divider"></div>
        </div>
        <div id="cifraContainer"></div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="now-playing" id="nowPlaying" style="opacity:0.4">
      <div class="np-title">Nenhuma música</div>
      <div class="np-artist">—</div>
    </div>
    <div class="sep"></div>
    <div class="ctrl-wrap">
      <div class="ctrl-label">Tom</div>
      <div class="ctrl-row">
        <button class="ctrl-btn accent" ontouchstart="handleBtnTouch(event,'key',-1)" onclick="changeKey(-1)">−</button>
        <span class="tone-display" id="toneDisplay">—</span>
        <button class="ctrl-btn accent" ontouchstart="handleBtnTouch(event,'key',1)"  onclick="changeKey(1)">+</button>
      </div>
    </div>
    <div class="sep"></div>
    <div class="ctrl-wrap">
      <div class="ctrl-label">Fonte</div>
      <div class="ctrl-row">
        <button class="ctrl-btn" ontouchstart="handleBtnTouch(event,'font',-1)" onclick="changeFontSize(-1)">−</button>
        <span class="ctrl-display" id="fontSizeDisplay">15</span>
        <button class="ctrl-btn" ontouchstart="handleBtnTouch(event,'font',1)"  onclick="changeFontSize(1)">+</button>
      </div>
    </div>
    <div class="sep"></div>
    <div class="ctrl-wrap">
      <div class="ctrl-label">Modo</div>
      <div class="ctrl-row">
        <button class="mode-btn" id="modeBtn" onclick="cycleMode()">L</button>
      </div>
    </div>
    <div class="sep"></div>
    <div class="ctrl-wrap">
      <div class="ctrl-label">Tema</div>
      <div class="ctrl-row">
        <button class="mode-btn" id="themeBtn" ontouchstart="handleThemeTouch(event)" onclick="toggleTheme()">
          <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="drawer-title">Playlist</div>
      <button class="close-btn" onclick="closeDrawer()">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <line x1="4" y1="4" x2="16" y2="16"/><line x1="16" y1="4" x2="4" y2="16"/>
        </svg>
      </button>
    </div>
    <div class="playlist-list" id="playlistList"></div>
  </div>
</div>

<div class="swipe-hint" id="swipeHint"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// TRANSPOSIÇÃO
// ═══════════════════════════════════════════════════════════════════════════
const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const FLAT_ROOTS = new Set([1,3,5,8,10]);

function noteIdx(n) {
  let i = SHARP.indexOf(n);
  return i === -1 ? FLAT.indexOf(n) : i;
}
function transposeNote(note, semi) {
  const i = noteIdx(note);
  if (i === -1) return note;
  const ni = ((i + semi) % 12 + 12) % 12;
  return FLAT_ROOTS.has(ni) ? FLAT[ni] : SHARP[ni];
}
function transposeChordLine(line, semi) {
  if (semi === 0) return line;
  const re = /([A-G][b#]?)((?:maj|min|m|M|aug|dim|sus|add)?[0-9]*(?:\([^)]*\))?(?:\/[A-G][b#]?)?)/g;
  let result = '', last = 0, m;
  while ((m = re.exec(line)) !== null) {
    const before = line[m.index - 1];
    if (before && /[a-z]/.test(before)) {
      result += line.slice(last, m.index + m[0].length);
      last = m.index + m[0].length;
      continue;
    }
    result += line.slice(last, m.index);
    const root = m[1], suffix = m[2];
    const slashIdx = suffix.lastIndexOf('/');
    let newChord;
    if (slashIdx !== -1) {
      newChord = transposeNote(root, semi) + suffix.slice(0, slashIdx) + '/' + transposeNote(suffix.slice(slashIdx+1), semi);
    } else {
      newChord = transposeNote(root, semi) + suffix;
    }
    const diff = m[0].length - newChord.length;
    result += newChord + (diff > 0 ? ' '.repeat(diff) : '');
    last = m.index + m[0].length;
  }
  return result + line.slice(last);
}
function transposeKeyName(key, semi) {
  if (!key) return key;
  const m = key.match(/^([A-G][b#]?)(m?)$/);
  if (!m) return key;
  if (semi === 0) return key;
  return transposeNote(m[1], semi) + m[2];
}

// Detecta o tom base escrito na cifra (primeiro acorde encontrado em linha de acordes)
function detectWrittenKey(cifraText) {
  const CHORD_RE = /^[A-G][b#]?(maj|min|m|M|aug|dim|sus|add)?[0-9]*(\([^)]*\))?(\/[A-G][b#]?)?$/;
  const lines = cifraText.split('\n');
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    if (/^(introdução|intro|verso|refrão|refrao|coro|ponte|pre|pré|final|solo|bridge|chorus)/i.test(trimmed)) continue;
    const tokens = trimmed.split(/\s+/).filter(Boolean);
    const chords = tokens.filter(t => CHORD_RE.test(t.replace(/[,;.!?]+$/, '')));
    if (chords.length >= 1 && chords.length / tokens.length >= 0.5) {
      const first = chords[0].replace(/[,;.!?]+$/, '');
      const m = first.match(/^([A-G][b#]?)/);
      if (m) return m[1];
    }
  }
  return null;
}

// Calcula offset em semitons: fromKey → toKey
function keyOffset(fromKey, toKey) {
  if (!fromKey || !toKey) return 0;
  const fromRoot = fromKey.match(/^([A-G][b#]?)/);
  const toRoot   = toKey.match(/^([A-G][b#]?)/);
  if (!fromRoot || !toRoot) return 0;
  const from = noteIdx(fromRoot[1]);
  const to   = noteIdx(toRoot[1]);
  if (from === -1 || to === -1) return 0;
  return ((to - from) % 12 + 12) % 12;
}

// ═══════════════════════════════════════════════════════════════════════════
// NORMALIZAÇÃO DE SEÇÕES
//
// Mapeia qualquer nome de seção para um dos 5 tipos canônicos:
//   intro | verso | pre-refrao | refrao | ponte
// + guarda o número do verso (verso 1, verso 2, ...)
// ═══════════════════════════════════════════════════════════════════════════

// tipo canônico → rótulo de exibição
const SECTION_DISPLAY = {
  'intro':      'Introdução',
  'verso':      'Verso',       // verso N é completado com o número
  'pre-refrao': 'Pré-refrão',
  'refrao':     'Refrão',
  'ponte':      'Ponte',
  '':           '',            // seção sem label (topo da música sem marcação)
};

// seções que devem ser ocultadas no modo "só letra"
const HIDDEN_IN_LETRA = new Set(['intro','ponte']);

function normalizeSection(rawLabel) {
  const t = rawLabel.trim().toLowerCase()
    // remove acentos para comparação
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  // intro / introdução
  if (/^intro/.test(t)) return { type: 'intro', num: null };

  // pré-refrão
  if (/^pr[eé]/.test(t) || /^pre/.test(t)) return { type: 'pre-refrao', num: null };

  // refrão / coro / chorus
  if (/^refr|^coro|^chorus/.test(t)) return { type: 'refrao', num: null };

  // ponte / bridge / solo / outro / final (tratados como ponte)
  if (/^pont|^bridg|^solo|^outro|^final|^interlud|^tag/.test(t)) return { type: 'ponte', num: null };

  // verso (pode ter número: "verso 1", "verso 2", "verse 2")
  if (/^vers/.test(t)) {
    const numMatch = rawLabel.match(/(\d+)/);
    return { type: 'verso', num: numMatch ? parseInt(numMatch[1]) : null };
  }

  // sem rótulo ou desconhecido → trata como verso sem número
  if (!t) return { type: '', num: null };

  // qualquer outro (ex: "intro 2") → ponte
  return { type: 'ponte', num: null };
}

function sectionDisplayLabel(norm) {
  if (!norm.type) return '';
  const base = SECTION_DISPLAY[norm.type] || norm.type;
  if (norm.type === 'verso' && norm.num) return `${base} ${norm.num}`;
  return base;
}

// ═══════════════════════════════════════════════════════════════════════════
// PARSER DE CIFRA EM TEXTO LIVRE
// ═══════════════════════════════════════════════════════════════════════════
const CHORD_PAT = /^[A-G][b#]?(maj|min|m|M|aug|dim|sus|add)?[0-9]*(\([^)]*\))?(\/[A-G][b#]?)?$/;

function looksLikeChord(token) {
  return CHORD_PAT.test(token.replace(/[,;.!?]+$/, ''));
}

function isChordLine(line) {
  const tokens = line.trim().split(/\s+/).filter(Boolean);
  if (!tokens.length) return false;
  const n = tokens.filter(looksLikeChord).length;
  return n >= 1 && n / tokens.length >= 0.5;
}

// Extrai só os nomes de acordes de uma linha de acordes (sem espaços de alinhamento)
function extractChords(line) {
  return line.trim().split(/\s+/).filter(t => looksLikeChord(t));
}

// Detecta rótulo de seção
const SECTION_KEYWORDS = /^(introdução|intro|verso|verse|refrão|refrao|coro|chorus|pré-refrão|pre-refrao|pre-refrao|ponte|bridge|solo|outro|final|interludio|interlúdio|tag)/i;

function parseSectionLabel(line) {
  const trimmed = line.trim();
  // palavra-chave no início
  if (SECTION_KEYWORDS.test(trimmed)) {
    const colonIdx = trimmed.indexOf(':');
    if (colonIdx !== -1) {
      return { label: trimmed.slice(0, colonIdx).trim(), rest: trimmed.slice(colonIdx+1).trim() };
    }
    // sem ":" mas linha completa é só a palavra-chave (com número opcional)
    if (/^[\w\s\-áéíóúàâêôãõç]+$/i.test(trimmed) && trimmed.length < 30 && !isChordLine(trimmed)) {
      return { label: trimmed, rest: '' };
    }
  }
  // linha curta terminando com ":"
  if (trimmed.endsWith(':') && trimmed.length < 40 && !isChordLine(trimmed)) {
    return { label: trimmed.slice(0, -1).trim(), rest: '' };
  }
  return null;
}

/**
 * parseCifra(rawText) → [{ rawLabel, norm, pairs, allChords }]
 *
 * pairs: [{ chords: string|null, lyric: string|null }]
 *   null/null = espaçador
 *
 * allChords: string[] — lista ordenada de todos os acordes da seção (para modo cifra)
 */
function parseCifra(raw) {
  const lines = raw.split('\n');
  const sections = [];
  let currentRawLabel = '';
  let pairs = [];
  let pendingChord = null;

  function flush(chord, lyric) {
    if (chord !== null || lyric !== null) pairs.push({ chords: chord, lyric });
  }
  function commitSection() {
    if (pendingChord !== null) { flush(pendingChord, null); pendingChord = null; }
    if (pairs.length > 0 || currentRawLabel) {
      const norm = normalizeSection(currentRawLabel);
      // coleta acordes de todas as chord-rows para o modo cifra
      const allChords = [];
      pairs.forEach(p => {
        if (p.chords) extractChords(p.chords).forEach(c => allChords.push(c));
      });
      sections.push({ rawLabel: currentRawLabel, norm, pairs: [...pairs], allChords });
    }
    pairs = [];
  }

  for (const line of lines) {
    const trimmed = line.trim();

    if (!trimmed) {
      if (pendingChord !== null) { flush(pendingChord, null); pendingChord = null; }
      if (pairs.length) pairs.push({ chords: null, lyric: null });
      continue;
    }

    const secMatch = parseSectionLabel(line);
    if (secMatch) {
      commitSection();
      currentRawLabel = secMatch.label;
      if (secMatch.rest) {
        if (isChordLine(secMatch.rest)) pendingChord = secMatch.rest;
        else flush(null, secMatch.rest);
      }
      continue;
    }

    if (isChordLine(line)) {
      if (pendingChord !== null) flush(pendingChord, null);
      pendingChord = line;
    } else {
      flush(pendingChord, trimmed);
      pendingChord = null;
    }
  }

  commitSection();
  if (!sections.length) sections.push({ rawLabel:'', norm:normalizeSection(''), pairs:[], allChords:[] });
  return sections;
}

// ═══════════════════════════════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════════════════════════════
let currentSong = null;
let baseOffset  = 0;  // offset fixo: tom escrito na cifra → tozm declarado (currentSong.tom)
let userOffset  = 0;  // offset adicional pelo botão +/- do usuário
let semiOffset  = 0;  // = baseOffset + userOffset (usado em toda transposição)
let fontSize    = 15;
let zoomScale   = 1;
let displayMode = 'ambos'; // 'ambos' | 'letra' | 'cifra'

const MIN_FONT = 11, MAX_FONT = 28;
const MIN_ZOOM = 0.5, MAX_ZOOM = 3;
const modeOrder = ['ambos','letra','cifra'];

// ═══════════════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════════════
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Gera o HTML da grade de acordes (modo cifra) para uma seção
function buildChordGrid(allChords, semi) {
  if (!allChords.length) return '';
  // transpõe e deduplica preservando ordem de primeira ocorrência
  const seen = new Set();
  const unique = [];
  allChords.forEach(c => {
    const t = transposeChordLine(c, semi);
    if (!seen.has(t)) { seen.add(t); unique.push(t); }
  });
  return unique.map((chord, i) => {
    const isLast = i === unique.length - 1;
    return `<span class="chord-cell">
      <span class="chord-cell-name">${esc(chord)}</span>${isLast ? '' : '<span class="chord-sep">|</span>'}
    </span>`;
  }).join('');
}

function renderCifra() {
  if (!currentSong) return;
  const sections = parseCifra(currentSong.cifra);
  const container = document.getElementById('cifraContainer');

  container.innerHTML = sections.map(sec => {
    const displayLabel = sectionDisplayLabel(sec.norm);
    const labelHtml = displayLabel
      ? `<span class="section-label">${esc(displayLabel)}</span>`
      : '';

    // classe CSS para controle de visibilidade por tipo
    const typeClass = sec.norm.type ? `sec-${sec.norm.type.replace(/[^a-z]/g,'-')}` : '';

    // pares (modo ambos)
    const pairsHtml = sec.pairs.map(pair => {
      if (pair.chords === null && pair.lyric === null) {
        return `<div class="spacer-block"></div>`;
      }
      let chordHtml = '', lyricHtml = '';
      if (pair.chords !== null) {
        chordHtml = `<span class="chord-row">${esc(transposeChordLine(pair.chords, semiOffset))}</span>`;
      }
      if (pair.lyric !== null) {
        lyricHtml = `<span class="lyric-row" style="font-size:${fontSize}px">${esc(pair.lyric)}</span>`;
      }
      return `<div class="pair-block">${chordHtml}${lyricHtml}</div>`;
    }).join('');

    // grade de acordes (modo cifra)
    const gridHtml = `<div class="chord-grid">${buildChordGrid(sec.allChords, semiOffset)}</div>`;

    return `<div class="cifra-section ${typeClass}">${labelHtml}${pairsHtml}${gridHtml}</div>`;
  }).join('');

  // tom: mostra o tom declarado + ajuste do usuário (não o offset base)
  document.getElementById('toneDisplay').textContent =
    transposeKeyName(currentSong.tom, userOffset) || '—';

  // now playing
  const np = document.getElementById('nowPlaying');
  np.style.opacity = '1';
  np.innerHTML = `<div class="np-title">${esc(currentSong.nome)}</div><div class="np-artist">${esc(currentSong.interprete || '—')}</div>`;

  buildPlaylist();
}

function buildPlaylist() {
  const list = document.getElementById('playlistList');
  const groups = {};
  songs.forEach((s,i) => {
    const g = s.group || 'Geral';
    if (!groups[g]) groups[g] = [];
    groups[g].push({...s, idx: i+1});
  });
  list.innerHTML = Object.entries(groups).map(([g, items]) => `
    <div class="playlist-group">
      <div class="playlist-group-name">${esc(g)}</div>
      ${items.map(s => `
        <div class="song-item ${currentSong && currentSong.id === s.id ? 'active' : ''}" onclick="selectSong(${s.id})">
          <span class="song-number">${s.idx}</span>
          <div class="song-info">
            <div class="song-name">${esc(s.nome)}</div>
            <div class="song-artist-item">${esc(s.interprete || '—')}</div>
          </div>
          <span class="song-key-badge">${esc(s.tom || '?')}</span>
          ${currentSong && currentSong.id === s.id ? '<div class="active-dot"></div>' : ''}
        </div>
      `).join('')}
    </div>
  `).join('');
}

function selectSong(id) {
  currentSong = songs.find(s => s.id === id);
  zoomScale = 1;
  applyZoom(); closeDrawer();

  // Calcula o offset base: tom escrito na cifra → tom declarado em currentSong.tom
  const writtenKey = detectWrittenKey(currentSong.cifra);
  baseOffset = keyOffset(writtenKey, currentSong.tom);
  userOffset = 0;
  semiOffset = baseOffset;

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('cifraContent').style.display = 'block';
  document.getElementById('displayTitle').textContent = currentSong.nome;
  document.getElementById('displayArtist').textContent = currentSong.interprete || '';
  document.getElementById('songView').scrollTo(0, 0);
  renderCifra();
}

// ═══════════════════════════════════════════════════════════════════════════
// CONTROLES
// ═══════════════════════════════════════════════════════════════════════════
function changeKey(delta) {
  if (!currentSong) return;
  userOffset += delta;
  semiOffset = baseOffset + userOffset;
  renderCifra();
}

function changeFontSize(delta) {
  fontSize = Math.min(MAX_FONT, Math.max(MIN_FONT, fontSize + delta));
  document.getElementById('fontSizeDisplay').textContent = fontSize;
  document.querySelectorAll('.lyric-row').forEach(el => el.style.fontSize = fontSize + 'px');
}

function applyZoom() {
  document.getElementById('zoomInner').style.transform = `scale(${zoomScale})`;
  document.getElementById('songView').style.overflowX = zoomScale > 1 ? 'auto' : 'hidden';
}

function cycleMode() {
  const idx = modeOrder.indexOf(displayMode);
  displayMode = modeOrder[(idx + 1) % modeOrder.length];
  document.body.classList.remove('mode-letra','mode-cifra');
  if (displayMode === 'letra') document.body.classList.add('mode-letra');
  if (displayMode === 'cifra') document.body.classList.add('mode-cifra');
  const btn = document.getElementById('modeBtn');
  btn.textContent = displayMode === 'cifra' ? 'C' : 'L';
  btn.classList.toggle('on', displayMode !== 'ambos');
  const labels = { ambos:'cifra + letra', letra:'só letra', cifra:'só cifra' };
  if (currentSong) showHint(labels[displayMode]);
}

function handleBtnTouch(e, type, delta) {
  e.preventDefault();
  if (type === 'key') changeKey(delta);
  else changeFontSize(delta);
}

// ─── TEMA ─────────────────────────────────────────────────────────
let isLight = false;

const SUN_PATH = 'M12 4.5V3m0 18v-1.5M4.5 12H3m18 0h-1.5M6.34 6.34 5.28 5.28m13.44 13.44-1.06-1.06M6.34 17.66l-1.06 1.06M18.72 5.28l-1.06 1.06M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z';
const MOON_PATH = 'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z';

function toggleTheme() {
  isLight = !isLight;
  document.body.classList.toggle('light', isLight);
  const path = document.querySelector('#themeIcon path');
  path.setAttribute('d', isLight ? SUN_PATH : MOON_PATH);
  localStorage.setItem('cancioneiro-theme', isLight ? 'light' : 'dark');
}

function handleThemeTouch(e) {
  e.preventDefault();
  toggleTheme();
}

// restaura tema salvo
(function() {
  if (localStorage.getItem('cancioneiro-theme') === 'light') {
    isLight = true;
    document.body.classList.add('light');
    // ícone já está no DOM neste ponto (script inline no fim do body)
    const path = document.querySelector('#themeIcon path');
    if (path) path.setAttribute('d', SUN_PATH);
  }
})();

// ═══════════════════════════════════════════════════════════════════════════
// SWIPE & PINCH
// ═══════════════════════════════════════════════════════════════════════════
function showHint(msg) {
  const h = document.getElementById('swipeHint');
  h.textContent = msg;
  h.classList.add('show');
  clearTimeout(h._t);
  h._t = setTimeout(() => h.classList.remove('show'), 1500);
}

function navigateSong(delta) {
  if (!currentSong) return;
  const idx = songs.findIndex(s => s.id === currentSong.id);
  const ni = idx + delta;
  if (ni < 0 || ni >= songs.length) {
    showHint(delta < 0 ? '← primeira música' : 'última música →');
    return;
  }
  selectSong(songs[ni].id);
  showHint((delta > 0 ? '→ ' : '← ') + songs[ni].nome);
}

const songView = document.getElementById('songView');
let touchState = null;

songView.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    touchState = { type:'swipe', startX:e.touches[0].clientX, startY:e.touches[0].clientY, startTime:Date.now(), moved:false };
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchState = { type:'pinch', startDist:Math.hypot(dx,dy), startZoom:zoomScale };
    e.preventDefault();
  }
}, { passive:false });

songView.addEventListener('touchmove', e => {
  if (!touchState) return;
  if (touchState.type === 'pinch' && e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    zoomScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, touchState.startZoom * Math.hypot(dx,dy) / touchState.startDist));
    applyZoom();
  } else if (touchState.type === 'swipe' && e.touches.length === 1) {
    const dx = Math.abs(e.touches[0].clientX - touchState.startX);
    const dy = Math.abs(e.touches[0].clientY - touchState.startY);
    if (dx > dy && dx > 8) touchState.moved = true;
  }
}, { passive:false });

songView.addEventListener('touchend', e => {
  if (!touchState) return;
  if (touchState.type === 'swipe' && touchState.moved) {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchState.startX;
    const dy = t.clientY - touchState.startY;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 80 && Date.now() - touchState.startTime < 400) {
      navigateSong(dx < 0 ? 1 : -1);
    }
  }
  touchState = null;
});

// ═══════════════════════════════════════════════════════════════════════════
// DRAWER
// ═══════════════════════════════════════════════════════════════════════════
function openDrawer()  { document.getElementById('drawer').classList.add('open'); buildPlaylist(); }
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
buildPlaylist();
</script>
